<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nizam-ul-Sharia System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Nastaliq Urdu', serif, sans-serif; }
    /* Fix for Urdu Dropdown Alignment & Line Height */
    select {
      direction: rtl;
      text-align: right;
      padding-top: 6px !important;
      padding-bottom: 6px !important;
      line-height: 1.6 !important;
      appearance: auto !important;
    }
    option {
      font-family: sans-serif; /* Clean font for options dropdown */
      direction: ltr;
      text-align: left;
      padding: 8px;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Header -->
  <div class="w-full max-w-4xl bg-blue-900 text-white p-4 rounded-t-lg shadow-md text-center text-xl font-bold mb-4">
    نظام الشریعہ انٹری سسٹم (Nizam-ul-Sharia System)
  </div>

  <!-- Login Card -->
  <div id="loginCard" class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">لاگ ان کریں (Login)</h2>
    <form onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2">یوزر نیم (Username)</label>
        <input type="text" id="username" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600" required dir="ltr">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 font-bold mb-2">پاس ورڈ (Password)</label>
        <input type="password" id="password" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-600" required dir="ltr">
      </div>
      <button type="submit" id="loginBtn" class="w-full bg-blue-700 text-white py-2 rounded hover:bg-blue-800 font-bold">لاگ ان (Login)</button>
    </form>
    <p id="loginError" class="text-red-500 text-center mt-4 hidden">غلط یوزر نیم یا پاس ورڈ!</p>
  </div>

  <!-- Main Transaction Form -->
  <div id="formCard" class="bg-white p-6 rounded-lg shadow-lg w-full max-w-4xl hidden">
    <h2 class="text-2xl font-bold text-blue-900 mb-6 border-b pb-2">نئی ٹرانزیکشن (New Transaction Entry)</h2>
    
    <form onsubmit="handleSaveTransaction(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-gray-700 font-bold mb-1">تاریخ (Date)</label>
        <input type="date" id="txnDate" class="w-full p-2 border rounded text-right" required dir="ltr">
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-1">ذیلی کیٹیگری (Sub Category)</label>
        <select id="subCategory" onchange="autoFillMapping()" class="w-full p-2 border rounded" required>
          <option value="">Select Option</option>
        </select>
      </div>

      <input type="hidden" id="txnType">
      <input type="hidden" id="category">

      <div>
        <label class="block text-gray-700 font-bold mb-1">شعبہ (Department)</label>
        <select id="department" class="w-full p-2 border rounded" required>
          <option value="">Select Option</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-1">پارٹی ٹائپ (Party Type)</label>
        <select id="partyType" class="w-full p-2 border rounded" required>
          <option value="">Select Option</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-1">پراپرٹی ایڈریس (Property Address)</label>
        <select id="propertyAddress" class="w-full p-2 border rounded">
          <option value="">Select Option</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-1">شخص/پارٹی کا نام (Party Name)</label>
        <input type="text" id="partyName" class="w-full p-2 border rounded" placeholder="Party Name" required>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-1">ادائیگی کا طریقہ (Payment Mode)</label>
        <select id="paymentMode" class="w-full p-2 border rounded" required>
          <option value="">Select Option</option>
        </select>
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-1">رقم (Amount PKR)</label>
        <input type="number" id="amount" class="w-full p-2 border rounded" required dir="ltr">
      </div>

      <div class="md:col-span-2">
        <label class="block text-gray-700 font-bold mb-1">تفصیل / ریمارکس (Remarks)</label>
        <textarea id="remarks" class="w-full p-2 border rounded" rows="2"></textarea>
      </div>

      <div class="md:col-span-2 mt-4">
        <button type="submit" id="saveBtn" class="w-full bg-green-700 text-white py-3 rounded hover:bg-green-800 font-bold text-lg">محفوظ کریں (Save Transaction)</button>
      </div>
    </form>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhPqsZzXd3G_UlmgoiMA814M_tSHOUD-yWTelEYo1TtloIMhYCoT7grP0SVfA_TcxhlA/exec";
    let mappingsData = [];
    let currentUser = "";

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("username").value;
      const p = document.getElementById("password").value;
      
      const res = await fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
      const data = await res.json();
      
      if(data.status === "success") {
        currentUser = u;
        document.getElementById("loginCard").classList.add("hidden");
        document.getElementById("formCard").classList.remove("hidden");
        loadFormOptions();
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    }

    async function loadFormOptions() {
      const res = await fetch(`${SCRIPT_URL}?action=getSettings`);
      const data = await res.json();
      
      mappingsData = data.mappings || [];
      
      const subCatSelect = document.getElementById("subCategory");
      mappingsData.forEach(m => {
        let opt = document.createElement("option");
        opt.value = m.subCategory;
        opt.innerText = m.subCategory;
        subCatSelect.appendChild(opt);
      });

      populateDropdown("department", data.departments);
      populateDropdown("partyType", data.partyTypes);
      populateDropdown("paymentMode", data.paymentModes);
      populateDropdown("propertyAddress", data.properties);
    }

    function populateDropdown(id, list) {
      const el = document.getElementById(id);
      if(!list) return;
      list.forEach(item => {
        let opt = document.createElement("option");
        opt.value = item;
        opt.innerText = item;
        el.appendChild(opt);
      });
    }

    function autoFillMapping() {
      const val = document.getElementById("subCategory").value;
      const match = mappingsData.find(m => m.subCategory === val);
      if(match) {
        document.getElementById("txnType").value = match.txnType;
        document.getElementById("category").value = match.category;
      }
    }

    async function handleSaveTransaction(e) {
      e.preventDefault();
      const saveBtn = document.getElementById("saveBtn");
      saveBtn.disabled = true;
      saveBtn.innerText = "محفوظ ہو رہا ہے (Saving...)";

      const payload = {
        date: document.getElementById("txnDate").value,
        department: document.getElementById("department").value,
        txnType: document.getElementById("txnType").value,
        category: document.getElementById("category").value,
        subCategory: document.getElementById("subCategory").value,
        partyType: document.getElementById("partyType").value,
        partyName: document.getElementById("partyName").value,
        propertyAddress: document.getElementById("propertyAddress").value,
        paymentMode: document.getElementById("paymentMode").value,
        amount: document.getElementById("amount").value,
        remarks: document.getElementById("remarks").value,
        enteredBy: currentUser
      };

      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      
      const data = await res.json();
      if(data.status === "success") {
        alert("Transaction Successfully Saved!");
        location.reload();
      } else {
        alert("Error saving transaction!");
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>

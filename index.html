<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nizam-ul-Sharia - Management System</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; direction: rtl; }
    .container { max-width: 650px; margin: auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eef2f5; padding-bottom: 15px; margin-bottom: 20px; }
    h2 { margin: 0; color: #2c3e50; font-size: 22px; }
    .lang-btn { background-color: #007bff; color: white; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .lang-btn:hover { background-color: #0056b3; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #495057; font-size: 14px; }
    select, input, textarea { width: 100%; padding: 11px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; background-color: #fff; outline: none; transition: border-color 0.2s; }
    select:focus, input:focus, textarea:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.25); }
    .submit-btn { width: 100%; padding: 13px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .submit-btn:hover { background-color: #218838; }
    .row { display: flex; gap: 15px; }
    .col { flex: 1; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h2 id="lbl-title">نظام الشریعہ - ٹرانزیکشن فارم</h2>
    <button type="button" class="lang-btn" onclick="toggleLanguage()" id="btn-lang">English</button>
  </div>

  <form id="txnForm">
    <div class="row">
      <div class="col form-group">
        <label id="lbl-dept">شعبہ (Department)</label>
        <select id="department" required></select>
      </div>
      <div class="col form-group">
        <label id="lbl-txntype">نوعیت ٹرانزیکشن (Txn Type)</label>
        <select id="txnType" required onchange="filterSubCategories()"></select>
      </div>
    </div>

    <div class="form-group">
      <label id="lbl-subcat">ذیلی کیٹیگری (Sub Category)</label>
      <select id="subCategory" required></select>
    </div>

    <div class="row">
      <div class="col form-group">
        <label id="lbl-paymode">ادائیگی کا طریقہ (Payment Mode)</label>
        <select id="paymentMode" required></select>
      </div>
      <div class="col form-group">
        <label id="lbl-partytype">فریق کی قسم (Party Type)</label>
        <select id="partyType" required></select>
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label id="lbl-contact">فون نمبر (Donor/Contact No)</label>
        <input type="text" id="contactNo" placeholder="03001234567" onblur="autoSearchDonor()" />
      </div>
      <div class="col form-group">
        <label id="lbl-partyname">نام (Person/Party Name)</label>
        <input type="text" id="partyName" required />
      </div>
    </div>

    <div class="form-group">
      <label id="lbl-amount">رقم (Amount)</label>
      <input type="number" id="amount" required min="1" />
    </div>

    <div class="form-group">
      <label id="lbl-remarks">تفصیل / کیفیات (Remarks)</label>
      <textarea id="remarks" rows="2"></textarea>
    </div>

    <button type="submit" class="submit-btn" id="btn-submit">انٹری محفوظ کریں</button>
  </form>
</div>

<script>
  // AAP KA GOOGLE APPS SCRIPT WEB APP URL PURE CODE MEIN YAHAN SET HOGA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhPqsZzXd3G_UlmgoiMA814M_tSHOUD-yWTelEYo1TtloIMhYCoT7grP0SVfA_TcxhlA/exec";

  let appSettings = {};
  let currentLang = 'ur'; // Default Urdu

  // Urdu Translation mapping helper
  function getTranslatedText(englishText) {
    if (!englishText) return "";
    if (currentLang === 'ur' && appSettings.translations && appSettings.translations[englishText]) {
      return appSettings.translations[englishText];
    }
    return englishText;
  }

  // Populate Dropdown Helper
  function populateSelect(elementId, itemsList) {
    const select = document.getElementById(elementId);
    const currentValue = select.value;
    select.innerHTML = `<option value="">${currentLang === 'ur' ? 'منتخب کریں...' : 'Select...'}</option>`;
    
    itemsList.forEach(item => {
      let option = document.createElement('option');
      option.value = item; // Backend Value (English)
      option.innerText = getTranslatedText(item); // UI Label (Urdu/English)
      select.appendChild(option);
    });
    
    if(currentValue) select.value = currentValue;
  }

  // Fetch Settings via API URL
  function loadSettings() {
    fetch(`${SCRIPT_URL}?action=getSettings`)
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          appSettings = data;
          renderAllDropdowns();
        }
      })
      .catch(err => console.error("Settings load error:", err));
  }

  // Render All Dropdowns
  function renderAllDropdowns() {
    populateSelect('department', appSettings.departments || []);
    populateSelect('txnType', appSettings.txnTypes || []);
    populateSelect('paymentMode', appSettings.paymentModes || []);
    populateSelect('partyType', appSettings.partyTypes || []);
    filterSubCategories();
  }

  // Filter Sub-Categories dynamically based on Selected Txn Type
  function filterSubCategories() {
    const selectedTxn = document.getElementById('txnType').value;
    let filteredSubCats = [];

    if (appSettings.mappings) {
      if (selectedTxn) {
        filteredSubCats = appSettings.mappings
          .filter(m => m.txnType === selectedTxn)
          .map(m => m.subCategory);
      } else {
        filteredSubCats = appSettings.mappings.map(m => m.subCategory);
      }
    }
    populateSelect('subCategory', Array.from(new Set(filteredSubCats)));
  }

  // Auto Search Donor Name by Phone Number
  function autoSearchDonor() {
    const phone = document.getElementById('contactNo').value;
    if (phone.length >= 7) {
      fetch(`${SCRIPT_URL}?action=searchDonor&phone=${encodeURIComponent(phone)}`)
        .then(res => res.json())
        .then(result => {
          if (result.status === "success" && result.name) {
            document.getElementById('partyName').value = result.name;
          }
        })
        .catch(err => console.error("Search donor error:", err));
    }
  }

  // Switch Language Urdu / English
  function toggleLanguage() {
    currentLang = currentLang === 'ur' ? 'en' : 'ur';
    document.body.dir = currentLang === 'ur' ? 'rtl' : 'ltr';
    document.getElementById('btn-lang').innerText = currentLang === 'ur' ? 'English' : 'اردو';
    
    document.getElementById('lbl-title').innerText = currentLang === 'ur' ? 'نظام الشریعہ - ٹرانزیکشن فارم' : 'Nizam-ul-Sharia - Transaction Form';
    document.getElementById('lbl-dept').innerText = currentLang === 'ur' ? 'شعبہ (Department)' : 'Department';
    document.getElementById('lbl-txntype').innerText = currentLang === 'ur' ? 'نوعیت ٹرانزیکشن (Txn Type)' : 'Transaction Type';
    document.getElementById('lbl-subcat').innerText = currentLang === 'ur' ? 'ذیلی کیٹیگری (Sub Category)' : 'Sub Category';
    document.getElementById('lbl-paymode').innerText = currentLang === 'ur' ? 'ادائیگی کا طریقہ (Payment Mode)' : 'Payment Mode';
    document.getElementById('lbl-partytype').innerText = currentLang === 'ur' ? 'فریق کی قسم (Party Type)' : 'Party Type';
    document.getElementById('lbl-contact').innerText = currentLang === 'ur' ? 'فون نمبر (Donor/Contact No)' : 'Contact No';
    document.getElementById('lbl-partyname').innerText = currentLang === 'ur' ? 'نام (Person/Party Name)' : 'Person/Party Name';
    document.getElementById('lbl-amount').innerText = currentLang === 'ur' ? 'رقم (Amount)' : 'Amount';
    document.getElementById('lbl-remarks').innerText = currentLang === 'ur' ? 'تفصیل / کیفیات (Remarks)' : 'Remarks';
    document.getElementById('btn-submit').innerText = currentLang === 'ur' ? 'انٹری محفوظ کریں' : 'Save Entry';

    renderAllDropdowns();
  }

  // Form Submit Handler
  document.getElementById('txnForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const subCat = document.getElementById('subCategory').value;
    const matchedMap = (appSettings.mappings || []).find(m => m.subCategory === subCat);
    const categoryName = matchedMap ? matchedMap.category : "";

    const payload = {
      department: document.getElementById('department').value,
      txnType: document.getElementById('txnType').value,
      category: categoryName,
      subCategory: subCat,
      paymentMode: document.getElementById('paymentMode').value,
      partyType: document.getElementById('partyType').value,
      partyName: document.getElementById('partyName').value,
      contactNo: document.getElementById('contactNo').value,
      amount: document.getElementById('amount').value,
      remarks: document.getElementById('remarks').value,
      propertyAddress: "",
      rentMonthYear: "",
      date: new Date().toLocaleDateString('en-GB'),
      enteredBy: "User",
      shouldPrint: false
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(result => {
      if (result.status === "success") {
        alert((currentLang === 'ur' ? "انٹری کامیابی سے محفوظ ہو گئی ہے! رسید نمبر: " : "Entry Saved Successfully! Receipt No: ") + result.receiptNo);
        document.getElementById('txnForm').reset();
      } else {
        alert(currentLang === 'ur' ? "خرابی: انٹری محفوظ نہیں ہو سکی۔" : "Error: Could not save entry.");
      }
    })
    .catch(err => {
      console.error("Submit error:", err);
      alert("Network Error!");
    });
  });

  window.onload = loadSettings;
</script>

</body>
</html>
